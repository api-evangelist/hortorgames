aid: hortorgames
name: Hortor Games
description: >-
  Hortor Games (Beijing Haoteng Chuangxiang Technology Co., Ltd. / 北京豪腾创想科技有限公司)
  is a Chinese mobile game developer and publisher focused on casual, word, and
  mini-game titles distributed as standalone apps and as WeChat / Douyin mini-games.
  Its catalog includes idiom and word puzzle games such as 成语小秀才, plus casual titles
  like 肥鹅健身房 (Goose Gym), 咸鱼之王, 海岛来了, and 稻田路. The company operates consumer game
  landing and distribution sites across the hortorgames.com, hortorcx.com, and
  666youxiting.com domains. It was surfaced as a portfolio company of Qiming Venture
  Partners and added to the API Evangelist network; it publishes no public developer
  API program, SDK, or documentation surface at this time.
